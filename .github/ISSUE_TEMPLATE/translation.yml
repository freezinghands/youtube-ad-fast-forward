name: Translation
description: Add or fix a translation of the extension's name and description, or of the README.
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        You can also open a pull request directly. [CONTRIBUTING.md](https://github.com/freezinghands/youtube-ad-fast-forward/blob/main/CONTRIBUTING.md#translations) explains which files to add.
  - type: input
    id: language
    attributes:
      label: Language
      description: The language and, if it matters, the region.
      placeholder: Japanese (ja)
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What to translate
      multiple: true
      options:
        - Extension name, description and toolbar tooltip (extension/_locales)
        - README
        - Chrome Web Store listing text
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Translation or correction
      description: Paste the text here if you are not opening a pull request.
  - type: checkboxes
    id: pr
    attributes:
      label: Pull request
      options:
        - label: I will open a pull request with this translation.
