<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Ad Fast-Forward icon. A black tile (the blacked-out ad) with an amber fast-forward mark
       (amber, like the ad segments on a video's progress bar). Not YouTube's logo or colours.
       extension/icons/128.png is this file as is: 96 px of artwork inside 16 px of transparent
       padding, as the Chrome Web Store asks. 16, 32 and 48 px are exported with
       viewBox="14 14 100 100", so the tile fills the toolbar slot. -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="#111114"/>
  <rect x="17" y="17" width="94" height="94" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <g fill="#ffb81c" stroke="#ffb81c" stroke-width="7" stroke-linejoin="round">
    <path d="M33 43 L62 64 L33 85 Z"/>
    <path d="M64 43 L93 64 L64 85 Z"/>
  </g>
</svg>
